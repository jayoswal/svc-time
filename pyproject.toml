[project]
name = "atlas-svc-time"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika==9.6.2",
  "alembic==1.13.3",
  "argon2-cffi==23.1.0",
  "fastapi==0.115.14",
  "httpx==0.27.2",
  "psycopg[binary]==3.2.13",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyjwt==2.13.0",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
