[project]
name = "atlas-svc-time"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika==9.*",
  "alembic==1.13.*",
  "argon2-cffi==23.*",
  "fastapi==0.115.*",
  "httpx==0.27.*",
  "psycopg[binary]==3.2.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "pyjwt==2.*",
  "sqlalchemy==2.0.*",
  "uvicorn[standard]==0.30.*",
]

[dependency-groups]
dev = [
  "jsonschema==4.*",
  "mypy==1.*",
  "pytest==8.*",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
